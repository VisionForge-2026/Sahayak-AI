<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Assistant | Sahayak AI</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        header {
            background: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #174b83;
        }

        header a {
            text-decoration: none;
            color: #174b83;
        }

        .heading {
            text-align: center;
            padding: 35px;
            background: linear-gradient(120deg, #e7f2ff, #fff4e6);
        }

        .heading h1 {
            color: #174b83;
        }

        .chat-container {
            max-width: 650px;
            margin: 35px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px #ddd;
            overflow: hidden;
        }

        .chat-header {
            background: #174b83;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .chat-box {
            height: 350px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            padding: 12px;
            margin: 12px 0;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.5;
        }

        .bot {
            background: #e7f2ff;
        }

        .user {
            background: #174b83;
            color: white;
            margin-left: auto;
        }

        .input-area {
            display: flex;
            padding: 15px;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            padding: 12px 20px;
            background: #174b83;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        footer {
            background: #174b83;
            color: white;
            text-align: center;
            padding: 18px;
        }

    </style>
</head>

<body>

<header>
    <h2> Sahayak AI</h2>
    <a href="/">Home</a>
</header>

<section class="heading">
    <h1>AI Government Scheme Assistant</h1>
    <p>Ask your questions in Telugu or English.</p>
</section>

<div class="chat-container">

    <div class="chat-header">
        <h3>Sahayak Assistant</h3>
        <p>How can I help you?</p>
    </div>

    <div class="chat-box" id="chatBox">

        <div class="message bot">
            Hello! Welcome to  Sahayak AI.
            Ask me about government schemes, eligibility and benefits.
        </div>

    </div>

    <div class="input-area">

        <input type="text" id="userInput"
        placeholder="Type your question..."
        onkeypress="if(event.key==='Enter') sendMessage()">

        <button onclick="sendMessage()">Send</button>

    </div>

</div>

<footer>
    Sahayak AI | Government Services Made Simple
</footer>

<script>

function sendMessage() {

    let input = document.getElementById("userInput");
    let question = input.value.trim().toLowerCase();

    if (question === "") return;

    let chatBox = document.getElementById("chatBox");

    chatBox.innerHTML += `
        <div class="message user">${input.value}</div>
    `;

    let answer = "Sorry, I don't have information about this question yet. Please ask about government schemes, PM-KISAN, education or health schemes.";

    if (question.includes("pm-kisan") || question.includes("farmer")) {

        answer = "PM-KISAN provides eligible farmer families with ₹6,000 per year in three instalments. Eligibility conditions and exclusions apply. Official website: https://pmkisan.gov.in/";

    }

    else if (question.includes("education") || question.includes("student") || question.includes("vidya")) {

        answer = "Students can explore education assistance schemes such as Jagananna Vidya Deevena, subject to current scheme availability and eligibility conditions.";

    }

    else if (question.includes("health") || question.includes("ayushman")) {

        answer = "Ayushman Bharat PM-JAY provides eligible families with health coverage up to ₹5 lakh per year. Check beneficiary eligibility through the official portal: https://pmjay.gov.in/";

    }

    else if (question.includes("job") || question.includes("skill") || question.includes("employment")) {

        answer = "PMKVY supports skill development and vocational training. Opportunities depend on available training programmes and eligibility.";

    }

    else if (question.includes("hello") || question.includes("hi")) {

        answer = "Hello! Welcome to Bharat Sahayak AI. How can I help you with government schemes?";

    }

    else if (question.includes("namaskaram") || question.includes("scheme")) {

        answer = "Welcome! I can help you explore government schemes related to education, agriculture, health and employment.";

    }

    setTimeout(function() {

        chatBox.innerHTML += `
            <div class="message bot">${answer}</div>
        `;

        chatBox.scrollTop = chatBox.scrollHeight;

    }, 500);

    input.value = "";

    chatBox.scrollTop = chatBox.scrollHeight;

}

</script>

</body>
</html>
