<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eligibility Checker | Bharat Sahayak AI</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #333;
        }

        header {
            background: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 2px 10px #ddd;
        }

        header h2 {
            color: #174b83;
            margin: 0;
        }

        header a {
            text-decoration: none;
            color: #174b83;
            font-weight: bold;
        }

        .heading {
            text-align: center;
            padding: 40px 15px;
            background: linear-gradient(120deg, #e7f2ff, #fff4e6);
        }

        .heading h1 {
            color: #174b83;
        }

        .container {
            max-width: 600px;
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px #ddd;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #174b83;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e67e22;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            background: #eef5ff;
            border-radius: 8px;
            display: none;
        }

        .scheme {
            background: white;
            padding: 15px;
            margin-top: 12px;
            border-radius: 7px;
            border-left: 4px solid #174b83;
        }

        footer {
            background: #174b83;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    <h2>Bharat Sahayak AI</h2>
    <a href="/">Home</a>
</header>

<section class="heading">
    <h1>Check Your Eligibility</h1>
    <p>Enter your details to discover potentially suitable schemes.</p>
</section>

<div class="container">

    <h2>Your Details</h2>

    <form id="eligibilityForm">

        <label>Age</label>
        <input type="number" id="age" min="1" max="120" required>

        <label>Annual Family Income (₹)</label>
        <input type="number" id="income" min="0" required>

        <label>Occupation</label>
        <select id="occupation" required>
            <option value="">Select Occupation</option>
            <option value="student">Student</option>
            <option value="farmer">Farmer</option>
            <option value="employee">Employee</option>
            <option value="unemployed">Unemployed</option>
        </select>

        <label>State</label>
        <select id="state" required>
            <option value="">Select State</option>
            <option value="Andhra Pradesh">Andhra Pradesh</option>
            <option value="Other">Other State</option>
        </select>

        <button type="submit">Check Eligibility</button>

    </form>

    <div id="result"></div>

</div>

<footer>
    Bharat Sahayak AI | Government Services Made Simple
</footer>

<script>

document.getElementById("eligibilityForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let age = Number(document.getElementById("age").value);
    let income = Number(document.getElementById("income").value);
    let occupation = document.getElementById("occupation").value;
    let state = document.getElementById("state").value;

    let schemes = [];

    if (occupation === "student") {
        schemes.push({
            name: "Jagananna Vidya Deevena",
            reason: "Student-related education assistance."
        });
    }

    if (occupation === "farmer") {
        schemes.push({
            name: "PM-KISAN",
            reason: "Farmer income support."
        });
    }

    if (age >= 18 && occupation === "unemployed") {
        schemes.push({
            name: "PMKVY",
            reason: "Skill development and vocational training."
        });
    }

    if (income <= 300000) {
        schemes.push({
            name: "Ayushman Bharat PM-JAY",
            reason: "Check applicable health scheme beneficiary criteria."
        });
    }

    let result = document.getElementById("result");

    result.style.display = "block";

    if (schemes.length > 0) {

        result.innerHTML = "<h3>Potentially Suitable Schemes</h3>";

        schemes.forEach(function(scheme) {
            result.innerHTML += `
                <div class="scheme">
                    <h3>${scheme.name}</h3>
                    <p>${scheme.reason}</p>
                </div>
            `;
        });

        result.innerHTML += "<p><b>Note:</b> These are preliminary matches, not confirmed eligibility. Verify the official scheme criteria before applying.</p>";

    } else {
        result.innerHTML = "<h3>No matching schemes found.</h3><p>Try checking other available schemes.</p>";
    }

});

</script>

</body>
</html>
