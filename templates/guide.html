<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Guide | Sahayak AI</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #333;
        }

        header {
            background: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #174b83;
        }

        header a {
            color: #174b83;
            text-decoration: none;
        }

        .hero {
            text-align: center;
            padding: 45px 15px;
            background: linear-gradient(120deg, #e7f2ff, #fff4e6);
        }

        .hero h1 {
            color: #174b83;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px #ddd;
        }

        select {
            width: 100%;
            padding: 13px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #174b83;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #e67e22;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #eef5ff;
            border-radius: 8px;
            line-height: 1.8;
        }

        footer {
            background: #174b83;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<header>
    <h2>Sahayak AI</h2>
    <a href="/">Home</a>
</header>

<section class="hero">
    <h1>Government Scheme Application Guide</h1>
    <p>Know the documents and steps required to apply.</p>
</section>

<div class="container">

    <h2>Select a Government Scheme</h2>

    <select id="scheme">
        <option value="">Choose a scheme</option>
        <option value="education">Jagananna Vidya Deevena</option>
        <option value="farmer">PM-KISAN</option>
        <option value="health">Ayushman Bharat PM-JAY</option>
        <option value="skill">PMKVY</option>
    </select>

    <button onclick="showGuide()">Get Application Guide</button>

    <div id="result"></div>

</div>

<footer>
    Sahayak AI | Government Services Made Simple
</footer>

<script>

function showGuide() {

    let scheme = document.getElementById("scheme").value;
    let result = document.getElementById("result");

    let guides = {

        education: {
            name: "Jagananna Vidya Deevena",
            documents: [
                "Aadhaar Card",
                "Income Certificate",
                "Student College Details",
                "Bank Account Details"
            ],
            steps: [
                "Check the current scheme availability.",
                "Contact the concerned college or welfare department.",
                "Submit the required documents.",
                "Verify your application status."
            ]
        },

        farmer: {
            name: "PM-KISAN",
            documents: [
                "Aadhaar Card",
                "Land Ownership Records",
                "Bank Account Details",
                "Mobile Number"
            ],
            steps: [
                "Visit the official PM-KISAN portal.",
                "Complete the required registration process.",
                "Provide the necessary details.",
                "Complete e-KYC if required.",
                "Check your beneficiary status."
            ]
        },

        health: {
            name: "Ayushman Bharat PM-JAY",
            documents: [
                "Aadhaar Card or accepted identity proof",
                "Ration Card or family identification details",
                "Other documents required for beneficiary verification"
            ],
            steps: [
                "Check whether your family is eligible.",
                "Visit an authorized Ayushman Bharat helpdesk.",
                "Complete beneficiary verification.",
                "Obtain your Ayushman card if eligible."
            ]
        },

        skill: {
            name: "PMKVY",
            documents: [
                "Aadhaar Card",
                "Educational Certificates",
                "Mobile Number",
                "Other documents required by the training centre"
            ],
            steps: [
                "Find an available training programme.",
                "Check the eligibility requirements.",
                "Register through an authorized training centre.",
                "Attend the training programme."
            ]
        }

    };

    if (scheme === "") {
        alert("Please select a scheme.");
        return;
    }

    let data = guides[scheme];

    result.style.display = "block";

    result.innerHTML = `
        <h2>${data.name}</h2>

        <h3>Required Documents</h3>

        <ul>
            ${data.documents.map(doc => `<li>${doc}</li>`).join("")}
        </ul>

        <h3>Application Procedure</h3>

        <ol>
            ${data.steps.map(step => `<li>${step}</li>`).join("")}
        </ol>

        <p><b>Note:</b> Document requirements and procedures may change.
        Verify the latest requirements through official sources.</p>
    `;

}

</script>

</body>
</html>
